name: APK 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 빌드
        run: gradle assembleRelease --no-daemon

      - name: APK 이름에 버전 붙이기
        run: cp app/build/outputs/apk/release/app-release.apk NotiPanel-v1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotiPanel-v1.${{ github.run_number }}
          path: NotiPanel-v1.${{ github.run_number }}.apk
